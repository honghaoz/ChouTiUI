# This workflow is used to build the root package and the packages in release configuration on all platforms.

name: build
on:
  release:
    types: [published]
  workflow_dispatch: # manual trigger
  schedule:
    # ┌───────────── minute (0 - 59)
    # │ ┌───────────── hour (0 - 23)
    # │ │ ┌───────────── day of the month (1 - 31)
    # │ │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    # │ │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    # │ │ │ │ │
    # * * * * *
    - cron: "0 15 * * *" # every day at 15:00 UTC (7:00 PST, 8:00 PDT)

concurrency:
  # newer commits cancel older in-flight CI on the same ref.
  # scoping the group by event keeps push runs from cancelling scheduled runs (and vice versa).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  TERM: xterm-256color
  DEVELOPER_DIR: /Applications/Xcode_${{ vars.XCODE_VERSION }}.app/Contents/Developer

jobs:
  build-root:
    name: Build root package
    runs-on: ${{ vars.MACOS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Cache CI artifacts
        uses: ./.github/actions/cache
        with:
          kind: build-root
          xcode-version: ${{ vars.XCODE_VERSION }}
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
      - name: Build root package
        run: make build

  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS, tvOS, visionOS]
    timeout-minutes: 30
    runs-on: ${{ vars.MACOS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Cache CI artifacts
        uses: ./.github/actions/cache
        with:
          kind: build-${{ matrix.platform }}
          xcode-version: ${{ vars.XCODE_VERSION }}
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
      - name: Build
        run: make build-release-${{ matrix.platform }} -C ChouTiUI
